  hero:
    title: "CARWatch"
    subtitle: "Plan saliva sampling studies, record sampling times, and analyse your data with open-source tools for researchers and participants."
    buttons:
      - text: "Get started"
        url: /getting-started/
        primary: true
      - text: "Open Study Manager"
        url: https://carwatch-tools.github.io/study-manager/
        primary: false
  features:
    title: "The CARWatch Framework Ecosystem"
    intro_text: "Use the Study Manager to prepare your study, the mobile apps to record sampling events, and R or Python for reproducible analysis."
    items:
      - icon_src: "/brand/globe.svg"
        title: "Study Manager"
        description: "A web-based study manager for study setup, generation of study materials, and processing of exported log files. Available online."
        url: https://carwatch-tools.github.io/study-manager/
      - icon_src: "/brand/android.svg"
        title: "Android App"
        description: "The Android app for reminders, awakening reports, and barcode-based recording of sampling events. Available on Google Play."
        url: https://play.google.com/store/apps/details?id=de.fau.cs.mad.carwatch
      - icon_src: "/brand/apple.svg"
        title: "iOS App"
        description: "The iOS app for reminders, awakening reports, and barcode-based recording of sampling events. Available on the App Store."
        url: https://apps.apple.com/de/app/carwatchapp/id6761441417
      - icon_src: "/brand/code.svg"
        title: "Python Package"
        description: "A Python package for loading, converting, validating, and analyzing CARWatch logs and saliva data. Available on PyPI."
        url: https://pypi.org/project/carwatch/
      - icon_src: "/brand/code.svg"
        title: "R Package"
        description: "An R package for processing CARWatch logs, assessing sampling-time compliance, and analyzing saliva data. Available on CRAN."
        url: https://CRAN.R-project.org/package=carwatch
  workflow:
    intro_text: "<strong>Study personnel</strong> use the browser-based Study Manager to configure the study and generate barcode labels and participant QR codes, then print and prepare the sampling materials. <strong>Participants</strong> use the CARWatch app on an Android or iOS smartphone together with the labelled tubes, QR code, and instructions supplied by the study team. <a href=\"/getting-started/\">Follow the getting-started guide</a> for materials, app setup, and data processing."
    steps:
      - title: "Plan and prepare"
        text: "Study personnel configure the sampling schedule in the Study Manager, print barcode labels and participant QR codes, and distribute the prepared materials."
      - title: "Set up the app"
        text: "Participants install the Android or iOS app and scan their study QR code. Walk through the sampling procedure together."
      - title: "Record sampling events"
        text: "Participants follow reminders, report awakening, and scan each sample barcode when collecting saliva."
      - title: "Export and analyse"
        text: "Participants export their logs and share them with the study team. Study personnel process logs in the browser or use R and Python to combine sampling records with laboratory measurements."
    image:
      src: "/img/carwatch_overview.png"
      alt: "Overview of the CARWatch workflow from study preparation to data processing"
      max_width: "760px"
  contact:
    title: "Project and contact"
    text: "Project and research enquiries: Robert Richer at"
    email: "robert.richer@fau.de"
    links:
      - text: "Source code on GitHub"
        url: https://github.com/carwatch-tools
