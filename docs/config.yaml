  text_blocks:
    - id: "why-carwatch"
      title: "Saliva sampling, from study setup to analysis"
      content: "<p><strong>CARWatch</strong> connects study preparation, participant guidance, and data processing in one open-source research framework. It was developed for <strong>cortisol awakening response (CAR)</strong> research and also supports other saliva sampling protocols.</p><p>Sampling times matter in field studies. Reminders guide participants, barcode scans timestamp sampling events, and structured logs help researchers review timing and protocol adherence.</p>"
      alignment: "left"
      max_width: "900px"
      order: 1
    - id: "workflow"
      title: "Workflow"
      content: ""
      alignment: "left"
      max_width: "900px"
      order: 2
    - id: "scientific-background"
      title: "Scientific background"
      content: "<p>The original CARWatch smartphone application was introduced by <strong>Richer et al. (2023)</strong> in <em>Psychoneuroendocrinology</em>. The paper describes the original application and its evaluation; the framework has since expanded to include additional platforms and analysis tools.</p><p><a href=\"https://doi.org/10.1016/j.psyneuen.2023.106073\">Read the original paper</a> · <a href=\"/publications/#citation\">Citation and scientific background</a></p>"
      alignment: "left"
      max_width: "900px"
      order: 3
    - id: "news"
      title: "News"
      content: ""
      alignment: "left"
      max_width: "900px"
      order: 4

